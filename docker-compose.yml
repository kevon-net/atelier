services:
  postgres:
    image: postgres:16-alpine
    container_name: local_postgres_atelier
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mysecretpassword
      POSTGRES_DB: atelier
    ports:
      - '5435:5432'
    volumes:
      - postgres_data_atelier:/var/lib/postgresql/data

volumes:
  postgres_data_atelier:

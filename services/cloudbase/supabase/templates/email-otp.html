<!-- supabase/templates/email_otp.html -->
<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8" />
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: #f4f4f5;
      color: #18181b;
      margin: 0;
      padding: 40px 20px;
    }

    .container {
      max-width: 480px;
      margin: 0 auto;
      background: #ffffff;
      border-radius: 8px;
      padding: 32px;
      border: 1px solid #e4e4e7;
    }

    .code {
      font-size: 24px;
      font-weight: bold;
      letter-spacing: 6px;
      color: #000000;
      background: #E2E2E2;
      padding: 16px;
      text-align: center;
      border-radius: 6px;
      margin: 24px 0;
    }

    .footer {
      margin-top: 24px;
      font-size: 12px;
      color: #71717a;
      text-align: center;
    }
  </style>
</head>

<body>
  <div class="container">
    <h2>Your Verification Code</h2>
    <p>Use the code below to log in or complete your registration:</p>

    <!-- GoTrue replaces {{ .Token }} with the 6-digit OTP code -->
    <div class="code">{{ .Token }}</div>

    <p>This code will expire shortly. If you did not request this code, you can safely ignore this email.</p>

    <div class="footer">
      &copy; Atelier
    </div>
  </div>
</body>

</html>
